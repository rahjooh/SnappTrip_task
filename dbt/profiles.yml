snapptrip:
  target: dev
  outputs:
    dev:
      type: spark
      method: thrift
      host: spark-master
      port: 10000
      user: airflow
      schema: default
      threads: 4
      connect_timeout: 60
      connect_retries: 3
      # Iceberg configuration
      spark_config:
        spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        spark.sql.catalog.local: org.apache.iceberg.spark.SparkCatalog
        spark.sql.catalog.local.type: hadoop
        spark.sql.catalog.local.warehouse: hdfs://namenode:9000/lakehouse
        spark.sql.defaultCatalog: local
    
    local:
      type: spark
      method: session
      host: local
      schema: default
      threads: 4
      # Use same warehouse as notebook (file when unset; HDFS in Docker when LAKEHOUSE_WAREHOUSE is set)
      server_side_parameters:
        spark.jars.packages: org.apache.hadoop:hadoop-client:3.3.6,org.apache.hadoop:hadoop-hdfs-client:3.3.6,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.4.3
        spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        spark.sql.catalog.local: org.apache.iceberg.spark.SparkCatalog
        spark.sql.catalog.local.type: hadoop
        spark.sql.catalog.local.warehouse: "{{ env_var('LAKEHOUSE_WAREHOUSE', 'file:///tmp/lakehouse') }}"
        spark.sql.defaultCatalog: local
        spark.sql.iceberg.compression-codec: snappy
        spark.sql.parquet.compression.codec: snappy
        spark.sql.iceberg.write.format.default: parquet

    # Run from Docker on data-platform network; uses namenode:9000 so HDFS client/server match (fixes RPC invalid length)
    local_docker:
      type: spark
      method: session
      host: local
      schema: default
      threads: 4
      server_side_parameters:
        spark.jars.packages: org.apache.hadoop:hadoop-client:3.3.6,org.apache.hadoop:hadoop-hdfs-client:3.3.6,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.4.3
        spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        spark.sql.catalog.local: org.apache.iceberg.spark.SparkCatalog
        spark.sql.catalog.local.type: hadoop
        spark.sql.catalog.local.warehouse: hdfs://namenode:9000/lakehouse
        spark.sql.defaultCatalog: local
        spark.sql.iceberg.compression-codec: snappy
        spark.sql.parquet.compression.codec: snappy
        spark.sql.iceberg.write.format.default: parquet
    
    prod:
      type: postgres
      host: postgres
      port: 5432
      user: airflow
      password: airflow
      dbname: gold_layer
      schema: gold
      threads: 4
      keepalives_idle: 0
